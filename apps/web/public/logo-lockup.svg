<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="520" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <clipPath id="hexClip">
      <polygon points="50,5 90,28 90,72 50,95 10,72 10,28" />
    </clipPath>
  </defs>

  <!-- Hex icon -->
  <polygon points="50,5 90,28 90,72 50,95 10,72 10,28"
    fill="#0f172a" stroke="url(#grad)" stroke-width="2.5" />

  <!-- EEG waveform inside hex (subtle) -->
  <g clip-path="url(#hexClip)">
    <polyline
      points="10,50 22,50 28,50 33,38 38,62 42,44 47,56 50,50 53,50 57,34 63,66 66,48 70,52 75,50 90,50"
      fill="none" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  </g>

  <!-- NV monogram -->
  <line x1="31" y1="67" x2="31" y2="33" stroke="url(#grad)" stroke-width="5" stroke-linecap="round"/>
  <line x1="31" y1="33" x2="47" y2="67" stroke="url(#grad)" stroke-width="5" stroke-linecap="round"/>
  <line x1="47" y1="33" x2="47" y2="67" stroke="url(#grad)" stroke-width="5" stroke-linecap="round"/>
  <line x1="54" y1="33" x2="63" y2="67" stroke="url(#grad)" stroke-width="5" stroke-linecap="round"/>
  <line x1="72" y1="33" x2="63" y2="67" stroke="url(#grad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Corner dots -->
  <circle cx="50" cy="5"  r="2.5" fill="#06b6d4" opacity="0.8"/>
  <circle cx="90" cy="28" r="2.5" fill="#6d88e8" opacity="0.8"/>
  <circle cx="90" cy="72" r="2.5" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="50" cy="95" r="2.5" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="10" cy="72" r="2.5" fill="#6d88e8" opacity="0.8"/>
  <circle cx="10" cy="28" r="2.5" fill="#06b6d4" opacity="0.8"/>

  <!-- Wordmark: NEUROVAULT -->
  <text x="108" y="62"
    font-family="'Space Grotesk', 'Inter', sans-serif"
    font-size="36"
    font-weight="700"
    letter-spacing="3"
    fill="url(#gradText)">NEUROVAULT</text>
</svg>
